name: CI Pipeline

on:
  push:
    branches: [main, develop, SessionManagement]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------
  #  1. Shared types compile check
  # -------------------------------------------------------
  typecheck-common:
    name: Typecheck shared types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p common/tsconfig.json

  # -------------------------------------------------------
  #  2. Server build + typecheck + tests
  # -------------------------------------------------------
  server:
    name: Server (build + test)
    runs-on: ubuntu-latest
    needs: typecheck-common
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install server deps
        run: cd server && npm ci

      - name: Typecheck
        run: cd server && npx tsc --noEmit

      - name: Build
        run: cd server && npm run build

      - name: Run tests
        run: cd server && npm test -- --ci --coverage
        env:
          NODE_ENV: test
          SYNC_ENCRYPTION_KEY: ci-test-key-32-chars-long-xxxxx

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 7

  # -------------------------------------------------------
  #  3. Client build + typecheck + lint
  # -------------------------------------------------------
  client:
    name: Client (build + lint)
    runs-on: ubuntu-latest
    needs: typecheck-common
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/concept.io/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install client deps
        run: cd client/concept.io && npm ci

      - name: Typecheck
        run: cd client/concept.io && npx tsc -b --noEmit

      - name: Lint
        run: cd client/concept.io && npx eslint . --max-warnings=200
        continue-on-error: true

      - name: Build
        run: cd client/concept.io && npm run build

  # -------------------------------------------------------
  #  4. Final gate (branch protection target)
  # -------------------------------------------------------
  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    if: always()
    needs: [typecheck-common, server, client]
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.typecheck-common.result }}" != "success" ]]; then
            echo "::error::Shared types typecheck failed"
            exit 1
          fi
          if [[ "${{ needs.server.result }}" != "success" ]]; then
            echo "::error::Server build/test failed"
            exit 1
          fi
          if [[ "${{ needs.client.result }}" != "success" ]]; then
            echo "::error::Client build/lint failed"
            exit 1
          fi
          echo "All CI checks passed!"
